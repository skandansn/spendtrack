# Merchant rules, evaluated top to bottom - the first category whose patterns
# match wins, so order matters. Patterns are case-insensitive regex run against
# the normalised merchant key. Edit freely: rules reload when the file changes.
#
# Anything matched here never reaches the LLM or Laya.
#
# Two conventions that matter:
#   - TOML literal strings (single quotes) so regex backslashes survive.
#   - Short or substring-prone tokens get \b on both sides. Without it 'MOBIL'
#     matches 'PAYMENT THANK YOU MOBILE' and 'MACY' matches 'PHARMACY'.

[categories]
# The fixed taxonomy. Charts stay stable because this list is closed.
list = [
  'Groceries', 'Restaurants', 'Coffee', 'Transport', 'Fuel', 'Travel',
  'Shopping', 'Subscriptions', 'Utilities', 'Rent', 'Health', 'Fitness',
  'Entertainment', 'Education', 'Personal Care', 'Fees', 'Income',
  'Transfer', 'Other',
]

[categories.describe]
# What each category covers, as Laya sees it. Keep these to two or three words:
# all 19 share one ~192-token option budget, and full descriptions overflowed it
# (34% agreement with the rules, against 46% for these).
Groceries = 'grocery store'
Restaurants = 'restaurant or food'
Coffee = 'coffee shop'
Transport = 'rideshare or transit'
Fuel = 'gas station'
Travel = 'airline or hotel'
Shopping = 'retail store'
Subscriptions = 'subscription service'
Utilities = 'phone or utility bill'
Rent = 'rent'
Health = 'pharmacy or doctor'
Fitness = 'gym'
Entertainment = 'movies or events'
Education = 'school or tuition'
'Personal Care' = 'salon or spa'
Fees = 'bank fee'
Income = 'salary or refund'
Transfer = 'card payment or transfer'
Other = 'other'

[rules]
# Transfers first: a card autopay also contains the bank's name, and counting
# it as spend double-counts every purchase already on that card.
Transfer = [
  'PAYMENT THANK YOU', 'AUTOPAY', 'ONLINE PAYMENT', 'CARD PAYMENT',
  'ZELLE', 'VENMO', 'CASH ?APP', 'PAYPAL TRANSFER', 'WIRE TRANSFER',
  'TRANSFER TO', 'TRANSFER FROM', 'ACH (DEBIT|CREDIT)', 'BILL ?PAY',
  'E[- ]?PAYMENT', '\bPYMT\b', '\bDEPOSIT\b', 'CREDIT CRD', 'EPAY\b',
]
Income = [
  'PAYROLL', 'DIRECT ?DEP', 'DIR DEP', '\bSALARY\b', 'IRS TREAS', 'TAX REF',
  'INTEREST PAID', 'CASHBACK BONUS', '\bREWARD',
